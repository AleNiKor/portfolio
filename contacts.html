<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korobetskikh Portfolio</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <nav class="nav">
        <div class="container">
            <div class="nav-row">
                <a href="./index.html" class="logo"><strong>Korobetskikh</strong> portfolio</a>
                <button class="dark-mode-btn">
                    <img src="./img/icons/sun.svg" alt="Light mode" class="dark-mode-btn__icon">
                    <img src="./img/icons/moon.svg" alt="Dark mode" class="dark-mode-btn__icon">
                </button>
                <ul class="nav-list">
                    <li class="nav-list__item"><a href="./blog.html" class="nav-list__link">Блог</a></li>
                    <li class="nav-list__item"><a href="./skills.html" class="nav-list__link">Опыт</a></li>
                    <li class="nav-list__item"><a href="./contacts.html"
                            class="nav-list__link nav-list__link--active">Контакты</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="section">
        <div class="container">
            <div class="contact-form">
                <h2 class="title-1">Связаться со мной</h2>
                <form id="feedback-form" method="post" action="#">
                    <div class="form-group">
                        <label for="name">Ваше имя</label>
                        <input type="text" id="name" required placeholder="Введите Ваше имя">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="Введите Ваш Email">
                    </div>
                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" placeholder="Введите Ваш номер телефона">
                    </div>
                    <div class="form-group">
                        <label for="message">Сообщение</label>
                        <textarea id="message" name="message" rows="5" required
                            placeholder="Введите Ваше сообщение"></textarea>
                    </div>
                    <button type="submit" class="btn">Отправить сообщение</button>
                </form>
            </div>
        </div>
    </main>


    <footer class="footer">
        <div class="container">
            <div class="footer__wrapper">
                <ul class="social">
                    <li class="social__item"><a href="https://github.com/AleNiKor"><img src="./img/icons/gitHub.svg"
                                alt="Link"></a></li>
                    <li class="social__item"><a href="https://vk.com/korobetskikh"><img src="./img/icons/vk.svg"
                                alt="Link"></a></li>
                </ul>
                <div class="copyright">
                    <p>© 2025 akorobetskikh.ru </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="./js/main.js"></script>

</body>

</html>
